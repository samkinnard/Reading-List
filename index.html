<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reading Room">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Reading Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap">
<style>
/* Layout: one phone-width column, sticky header, bottom tab bar, slide-up sheet for add/edit. */
:root{
  --bg:#eceee4; --card:#f8f8f2; --line:#d9dccb; --fg:#2a2822; --muted:#6c6a5c;
  --moss:#4a5d3a; --moss-soft:#dde6cf; --bark:#7b5d3c; --bark-soft:#eadfca;
  --gold:#b8891f; --gold-soft:#f3e2a8; --gold-ink:#6b4d0e; --clay:#a4564a; --clay-soft:#efd5cd;
  --on-moss:#f6f7ee; --shadow:0 -8px 30px rgba(40,36,24,.18);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1e17; --card:#242a20; --line:#363d30; --fg:#ebe8da; --muted:#a09d8c;
  --moss:#9fb987; --moss-soft:#34412b; --bark:#c5a47a; --bark-soft:#3d3326;
  --gold:#e0b84f; --gold-soft:#4d3f17; --gold-ink:#f2d98a; --clay:#d98c7e; --clay-soft:#4c2e29;
  --on-moss:#1a1e17; --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1e17; --card:#242a20; --line:#363d30; --fg:#ebe8da; --muted:#a09d8c;
  --moss:#9fb987; --moss-soft:#34412b; --bark:#c5a47a; --bark-soft:#3d3326;
  --gold:#e0b84f; --gold-soft:#4d3f17; --gold-ink:#f2d98a; --clay:#d98c7e; --clay-soft:#4c2e29;
  --on-moss:#1a1e17; --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:680px;margin:0 auto;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
header.top h1{font:600 26px/1.1 var(--serif);margin:0;flex:1;min-width:0;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.addbtn{height:44px;padding:0 18px 0 14px;border-radius:22px;border:0;background:var(--moss);color:var(--on-moss);font-weight:600;display:flex;align-items:center;gap:6px;flex:none}
.addbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
h2{font:600 20px/1.2 var(--serif);margin:26px 0 10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--moss);background:var(--moss-soft)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;min-height:40px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;user-select:none}
.chip[aria-pressed="true"]{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
.chip small{opacity:.75}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input,.tools select{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;min-height:60px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font:600 17px/1.25 var(--serif);overflow-wrap:anywhere}
.row .a{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;font-size:13px;color:var(--muted)}
.rate{font-weight:700;color:var(--bark);font-variant-numeric:tabular-nums;font-size:15px}
.pill{border-radius:10px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.finished{background:var(--moss-soft);color:var(--moss)}
.pill.unread{background:var(--bark-soft);color:var(--bark)}
.pill.reading{background:var(--gold-soft);color:var(--gold-ink)}
.pill.fmt{background:var(--bark-soft);color:var(--bark)}
.pill.dnf{background:var(--clay-soft);color:var(--clay)}
.pill.own{background:none;border:1px solid var(--line);color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;font:600 19px var(--serif);color:var(--fg);margin-bottom:4px}
.cards{display:flex;flex-direction:column;gap:12px}
.bookcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bookcard .t{font:600 22px/1.2 var(--serif);overflow-wrap:anywhere}
.bookcard .a{color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 16px;min-height:44px;font-weight:600}
.btn.primary{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
.btn.danger{color:var(--clay);border-color:var(--clay)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font:600 28px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:12px;background:var(--moss-soft);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--moss);border-radius:6px}
.bar.gold .fill{background:var(--gold)}
.bar.gold .track{background:var(--gold-soft)}
.bar .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;min-width:3.2em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.prog{height:14px;border-radius:7px;background:var(--moss-soft);overflow:hidden;margin:8px 0}
.prog div{height:100%;background:var(--moss)}
.goalrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.goalrow input{width:72px;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;text-align:center}

.row.five{background:var(--gold-soft);box-shadow:inset 5px 0 0 var(--gold)}
.row.five .rate{color:var(--gold-ink)}
.bookcard .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.bookcard .top>div{min-width:0}
.pline{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.pline b{color:var(--fg);font:600 22px/1 var(--serif);font-variant-numeric:tabular-nums}
.bookcard .prog{margin:0}
.pin{display:flex;gap:8px;align-items:center}
.pin label{font-size:13px;font-weight:600;color:var(--muted);flex:none}
.pin input{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px}
.big{font:600 30px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.panel.gold{background:var(--gold-soft);border-color:var(--gold)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-of-type{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(20,22,16,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet h3{font:600 24px var(--serif);margin:0 0 14px}
.field{margin-bottom:16px}
.field>label,.field>.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.field textarea{min-height:80px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:21px;font-size:14px;font-weight:500}
.opt input:checked+span{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
.opt input:focus-visible+span{outline:2px solid var(--moss);outline-offset:2px}
.opt.r span{font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.actions{display:flex;gap:10px;margin-top:8px;position:sticky;bottom:0}
.actions .btn{flex:1}
textarea.code{width:100%;height:110px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:600;z-index:50;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>
</head>

/* data */
function mapGenres(arr){
  const out=[];(Array.isArray(arr)?arr:[]).forEach(g=>{
    const k=String(g).trim().toLowerCase();
    const hit=GENRES.find(x=>x.toLowerCase()===k)||GENRE_MAP[k];
    if(hit&&!out.includes(hit))out.push(hit);
  });
  return GENRES.filter(g=>out.includes(g));
}
function normalize(x,id){
  let owned="";
  if(x.owned===true||x.owned==="Y"||x.owned==="owned")owned="owned";
  else if(x.owned===false||x.owned==="N"||x.owned==="not")owned="not";
  else if(x.owned==="library")owned="library";
  return{id,title:String(x.title||""),last:String(x.last||""),first:String(x.first||""),
    status:STATUS[x.status]?x.status:"unread",owned,
    format:FORMATS.includes(x.format)?x.format:"",
    pages:Math.max(0,parseInt(x.pages,10)||0),minutes:Math.max(0,parseInt(x.minutes,10)||0),progress:Math.max(0,Math.round(+x.progress||0)),
    date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||"")?x.date:"",rating:+x.rating||0,
    genres:mapGenres(x.genres),notes:String(x.notes||"")};
}
let nextId=1,books=[];
function seedBooks(){nextId=1;return SEED.map(r=>normalize({title:r[0],last:r[1],first:r[2],status:r[3],owned:r[4],format:r[5],rating:r[6],genres:r[7],notes:r[9]},nextId++))}
function patchGenres(){
  if(lsGet("readingRoom.patch1"))return;
  SEED.forEach(r=>{const add=mapGenres(r[7]).filter(g=>g==="Non-Fiction"||g==="Memoir");if(!add.length)return;
    const b=books.find(x=>x.title===r[0]&&x.last===r[1]);if(b)b.genres=GENRES.filter(g=>b.genres.includes(g)||add.includes(g))});
  lsSet("readingRoom.patch1","1");save();
}
function load(){
  try{const raw=lsGet(KEY);if(raw){const a=JSON.parse(raw);if(Array.isArray(a)&&a.length){books=a;nextId=Math.max(0,...a.map(b=>b.id))+1;patchGenres();return}}}catch(e){}
  try{const old=lsGet(OLDKEY);if(old){const a=JSON.parse(old);if(Array.isArray(a)&&a.length){nextId=1;books=a.map(x=>normalize(x,nextId++));save();return}}}catch(e){}
  books=seedBooks();save();
}
function save(){lsSet(KEY,JSON.stringify(books))}
function goal(){const g=parseInt(lsGet(GOALKEY),10);return g>0?g:24}

/* helpers */
function parseAuthor(s){
  s=s.trim().replace(/\s+/g," ");if(!s)return{first:"",last:""};
  if(s.includes("&")){const p=s.split("&").map(parseAuthor);return{first:p.map(x=>x.first).join(" & "),last:p.map(x=>x.last).join(" & ")}}
  let jr="";const m=s.match(/^(.*?)\s+(Jr\.?|Sr\.?)$/i);if(m){s=m[1];jr=" "+m[2]}
  const small=["le","de","la","van","von","da","di","du","del","der"];
  const t=s.split(" ");if(t.length===1)return{first:"",last:t[0]+jr};
  let i=t.length-1;while(i>1&&small.includes(t[i-1].toLowerCase()))i--;
  return{first:t.slice(0,i).join(" "),last:t.slice(i).join(" ")+jr};
}
const authorName=b=>(b.first?b.first+" ":"")+b.last;
const cmpAuthor=(a,b)=>a.last.localeCompare(b.last,undefined,{sensitivity:"base"})||a.first.localeCompare(b.first,undefined,{sensitivity:"base"})||a.title.localeCompare(b.title,undefined,{sensitivity:"base"});
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(iso){if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const fmtR=r=>String(+(+r).toFixed(2));
const fmtN=n=>Math.round(n).toLocaleString();
function fmtHM(m){return m>0?Math.floor(m/60)+":"+String(m%60).padStart(2,"0"):""}
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h&&r?`${h} hr ${r} min`:h?`${h} hr`:`${r} min`}
function parseHM(s){s=String(s).trim();if(!s)return 0;let m;
  if((m=s.match(/^(\d+):(\d{1,2})$/))&&+m[2]<60)return +m[1]*60+ +m[2];
  if(/^\d+(\.\d+)?$/.test(s))return Math.round(parseFloat(s)*60);
  return NaN}

/* rows */
function row(b,mode){
  let meta="";
  if(b.status==="finished"){meta=(b.rating?`<span class="rate">★ ${fmtR(b.rating)}</span>`:"")+(b.date&&mode==="year"?`<span>${fmtDate(b.date)}</span>`:"")+(b.date&&mode==="library"?`<span>${fmtDate(b.date)}</span>`:"")}
  else if(mode==="library")meta=`<span class="pill ${b.status}">${STATUS[b.status]}</span>`;
  if(b.status==="unread"&&b.owned)meta+=`<span class="pill own">${OWN[b.owned]}</span>`;
  const five=b.status==="finished"&&b.rating===5?" five":"";
  return `<button class="row${five}" data-view="${b.id}"><span class="main"><div class="t">${esc(b.title)}</div><div class="a">${esc(authorName(b))}</div></span><span class="meta">${meta}</span></button>`;
}
function listHTML(arr,mode,emptyT,emptyS){
  if(!arr.length)return `<div class="empty"><b>${emptyT}</b>${emptyS||""}</div>`;
  return `<div class="list">${arr.map(b=>row(b,mode)).join("")}</div>`;
}
const matchQ=(b,q)=>!q||(b.title+" "+authorName(b)+" "+b.genres.join(" ")).toLowerCase().includes(q.toLowerCase());

/* reading */
function progressHTML(b){
  const t=total(b),p=b.progress,au=isAudio(b);
  const unit=au?"Time Listened":"Current Page";
  let top;
  if(t>0){
    const pct=Math.min(100,Math.round(p/t*100)),left=Math.max(0,t-p);
    top=`<div class="pline"><b>${pct}%</b><span>${au?fmtDur(p)+" of "+fmtDur(t)+" · "+fmtDur(left)+" left":"Page "+fmtN(p)+" of "+fmtN(t)+" · "+fmtN(left)+" left"}</span></div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div style="width:${pct}%"></div></div>`;
  }else{
    top=`<p class="hint" style="margin:0">${au?"Add the audiobook length":"Add the page count"} in Edit to see your percent complete.</p>`;
  }
  return top+`<div class="pin"><label for="pi_${b.id}">${unit}</label><input id="pi_${b.id}" data-pin="${b.id}" ${au?'type="text" inputmode="text" placeholder="h:mm"':'type="number" inputmode="numeric" min="0" placeholder="Page"'} value="${au?fmtHM(p):(p||"")}"><button class="btn primary" data-prog="${b.id}">Update</button></div>`;
}
function viewReading(){
  const cur=books.filter(b=>b.status==="reading").sort(cmpAuthor);
  const n=books.filter(b=>b.status==="unread").length;
  let h=`<p class="sub">${cur.length?cur.length+(cur.length===1?" book":" books")+" in progress":"Nothing in progress"}</p>`;
  if(!cur.length)return h+`<div class="empty"><b>Pick Your Next Book</b>Start one from your TBR list (${n} waiting), or add a new book.<div class="btnrow" style="justify-content:center;margin-top:14px"><button class="btn primary" data-go="toread">Open TBR</button></div></div>`;
  return h+`<div class="cards">${cur.map(b=>`<div class="bookcard"><div class="top"><div><div class="t">${esc(b.title)}</div><div class="a">${esc(authorName(b))}</div></div><span class="pill fmt">${b.format||"Format Not Set"}</span></div>${progressHTML(b)}<div class="btnrow"><button class="btn primary" data-finish="${b.id}">Finished It</button><button class="btn" data-edit="${b.id}">Edit</button></div></div>`).join("")}</div>`;
}
function saveProgress(id){
  const b=books.find(x=>x.id===id),inp=$("#pi_"+id);if(!b||!inp)return;
  let v;
  if(isAudio(b)){v=parseHM(inp.value);if(isNaN(v)){toast("Use h:mm, like 2:30");return}}
  else{v=inp.value.trim()===""?0:parseInt(inp.value,10);if(isNaN(v)||v<0){toast("Enter a page number");return}}
  b.progress=v;save();render();toast("Progress Saved");
}

/* years */
function viewYears(){
  const fin=books.filter(b=>b.status==="finished");
  const years=[...new Set(fin.filter(b=>b.date).map(b=>b.date.slice(0,4)))].sort().reverse();
  const nodate=fin.filter(b=>!b.date).length;
  if(S.year===null||(S.year!=="none"&&!years.includes(S.year))){S.year=years.length?(years.includes(String(new Date().getFullYear()))?String(new Date().getFullYear()):years[0]):"none";S.month="all"}
  const inYear=S.year==="none"?fin.filter(b=>!b.date):fin.filter(b=>b.date&&b.date.slice(0,4)===S.year);
  const mcount=MONTHS.map((m,i)=>inYear.filter(b=>b.date&&+b.date.slice(5,7)===i+1).length);
  if(S.month!=="all"&&!mcount[+S.month-1])S.month="all";
  const sel=(S.month==="all"?inYear:inYear.filter(b=>+b.date.slice(5,7)===+S.month)).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||cmpAuthor(a,b));
  const r=sel.filter(b=>b.rating>0).map(b=>b.rating);
  let h=`<div class="seg">${years.map(y=>`<button class="chip" data-year="${y}" aria-pressed="${S.year===y}">${y} <small>${fin.filter(b=>b.date&&b.date.slice(0,4)===y).length}</small></button>`).join("")}${nodate?`<button class="chip" data-year="none" aria-pressed="${S.year==="none"}">No Date <small>${nodate}</small></button>`:""}</div>`;
  if(S.year!=="none"&&inYear.length)h+=`<div class="seg"><button class="chip" data-month="all" aria-pressed="${S.month==="all"}">All Months <small>${inYear.length}</small></button>${MONTHS.map((m,i)=>mcount[i]?`<button class="chip" data-month="${i+1}" aria-pressed="${+S.month===i+1}">${m} <small>${mcount[i]}</small></button>`:"").join("")}</div>`;
  h+=`<p class="sub">${sel.length} finished${r.length?" · average rating "+avg(r).toFixed(2):""}</p>`;
  if(S.year==="none"&&nodate)h+=`<p class="hint" style="margin:-6px 0 12px">These books have no finish date yet. Open one and add a date to file it under a year.</p>`;
  return h+listHTML(sel,"year","Nothing Finished Here","Mark a book finished and it appears here.");
}

function fillLibrary(){
  let a=books.filter(b=>(S.lib.st==="all"||b.status===S.lib.st)&&matchQ(b,S.lib.q));
  const so=S.lib.sort;
  if(so==="author")a.sort(cmpAuthor);else if(so==="title")a.sort((x,y)=>x.title.localeCompare(y.title,undefined,{sensitivity:"base"}));

function periodGroups(list,val){
  if(S.sy==="all"){
    const m={};list.forEach(b=>{if(b.date){const y=b.date.slice(0,4);m[y]=(m[y]||0)+val(b)}});
    return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0]));
  }
  const m=Array(12).fill(0);list.forEach(b=>{if(b.date)m[+b.date.slice(5,7)-1]+=val(b)});
  return m.map((v,i)=>[MONTHS[i],v]).filter(x=>x[1]>0);
}
function viewStats(){
  const allFin=books.filter(b=>b.status==="finished");
  const years=[...new Set(allFin.filter(b=>b.date).map(b=>b.date.slice(0,4)))].sort().reverse();
  if(S.sy!=="all"&&!years.includes(S.sy))S.sy="all";
  const fin=S.sy==="all"?allFin:allFin.filter(b=>b.date&&b.date.slice(0,4)===S.sy);
  const rt=fin.filter(b=>b.rating>0).map(b=>b.rating);
  const printB=fin.filter(b=>!isAudio(b)&&b.pages>0),audioB=fin.filter(b=>isAudio(b)&&b.minutes>0);
  const pagesTotal=printB.reduce((s,b)=>s+b.pages,0),minsTotal=audioB.reduce((s,b)=>s+b.minutes,0);
  const scopeName=S.sy==="all"?"All Time":S.sy;
  const per=S.sy==="all"?"Year":"Month";
  let h=`<div class="seg"><button class="chip" data-sy="all" aria-pressed="${S.sy==="all"}">All Time</button>${years.map(y=>`<button class="chip" data-sy="${y}" aria-pressed="${S.sy===y}">${y}</button>`).join("")}</div>`;
  h+=`<div class="tiles">
    <div class="tile"><b>${fin.length}</b><span>Books Finished</span></div>
    <div class="tile"><b>${rt.length?avg(rt).toFixed(2):"–"}</b><span>Average Rating</span></div>
    <div class="tile"><b>${pagesTotal?fmtN(pagesTotal):"–"}</b><span>Pages Read</span></div>
    <div class="tile"><b>${minsTotal?fmtDur(minsTotal).replace(" hr","h").replace(" min","m"):"–"}</b><span>Time Listened</span></div></div>`;
  const yr=String(new Date().getFullYear()),thisYr=allFin.filter(b=>b.date&&b.date.slice(0,4)===yr).length,g=goal();
  h+=`<h2>${yr} Goal</h2><div class="panel"><b style="font:600 20px var(--serif)">${thisYr} of ${g} books</b><div class="prog"><div style="width:${Math.min(100,thisYr/g*100)}%"></div></div><div class="goalrow">Yearly Goal <input type="number" id="goal" min="1" max="999" value="${g}" aria-label="Yearly goal"> books</div></div>`;
  if(!fin.length)return h+`<div class="empty" style="margin-top:20px"><b>No Finished Books Here</b>Pick a different period, or finish a book.</div>`;
  const dist=[...SCALE].reverse().map(([v,l])=>[String(v)+" · "+l,rt.filter(x=>x===v).length,null,v===5?"gold":""]).filter(d=>d[1]>0);
  h+=`<h2>Ratings · ${scopeName}</h2><div class="panel">${rt.length?bars(dist)+`<p class="hint">${rt.filter(x=>x>=4).length} of ${rt.length} rated books are 4 or higher. Median ${fmtR(median(rt))}.</p>`:`<p class="hint" style="margin:0">Rate finished books to see this.</p>`}</div>`;
  const gm={};fin.forEach(b=>b.genres.forEach(x=>{(gm[x]=gm[x]||{n:0,r:[]}).n++;if(b.rating>0)gm[x].r.push(b.rating)}));
  const gl=Object.entries(gm).sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0]));
  h+=`<h2>Genres · ${scopeName}</h2><div class="panel">${gl.length?bars(gl.map(([k,v])=>[k,v.n,v.r]),(v,r)=>r&&r.length?`${v} · ★${avg(r).toFixed(1)}`:v):`<p class="hint" style="margin:0">No genres on these books yet.</p>`}</div>`;
  const am={};fin.forEach(b=>{const k=authorName(b);(am[k]=am[k]||{n:0,r:[]}).n++;if(b.rating>0)am[k].r.push(b.rating)});
  const al=Object.entries(am).sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0])).slice(0,10);
  h+=`<h2>Top Authors · ${scopeName}</h2><div class="panel">${bars(al.map(([k,v])=>[k,v.n,v.r]),(v,r)=>r&&r.length?`${v} · ★${avg(r).toFixed(1)}`:v)}</div>`;
  const bp=periodGroups(fin,()=>1);
  h+=`<h2>Books Finished by ${per}</h2><div class="panel">${bp.length?bars(bp):`<p class="hint" style="margin:0">Add finish dates to see this.</p>`}</div>`;
  const undated=fin.filter(b=>!b.date).length;
  const note=undated&&S.sy==="all"?`<p class="hint">${undated} finished ${undated===1?"book has":"books have"} no finish date and ${undated===1?"is":"are"} left out of the by-${per.toLowerCase()} chart.</p>`:"";
  h+=`<h2>Pages Read · ${scopeName}</h2><div class="panel">`;
  if(printB.length){
    const lg=[...printB].sort((a,b)=>b.pages-a.pages)[0];
    h+=`<div class="big">${fmtN(pagesTotal)} pages</div><div style="height:8px"></div>
    <div class="kv"><span>Books With Page Counts</span><span>${printB.length} of ${fin.filter(b=>!isAudio(b)).length}</span></div>
    <div class="kv"><span>Average Length</span><span>${fmtN(pagesTotal/printB.length)} pages</span></div>
    <div class="kv"><span>Longest Book</span><span>${esc(lg.title)} (${fmtN(lg.pages)})</span></div>`;
    const pg=periodGroups(printB,b=>b.pages);
    if(pg.length)h+=`<h2 style="font-size:16px;margin:16px 0 8px">By ${per}</h2>`+bars(pg,v=>fmtN(v));
  }else h+=`<p class="hint" style="margin:0">Add page counts to your finished print books to see totals.</p>`;
  h+=note+`</div>`;
  h+=`<h2>Hours Listened · ${scopeName}</h2><div class="panel">`;
  if(audioB.length){
    const lg=[...audioB].sort((a,b)=>b.minutes-a.minutes)[0];
    h+=`<div class="big">${fmtDur(minsTotal)}</div><div style="height:8px"></div>
    <div class="kv"><span>Audiobooks Finished</span><span>${audioB.length} of ${fin.filter(isAudio).length}</span></div>
    <div class="kv"><span>Average Length</span><span>${fmtDur(minsTotal/audioB.length)}</span></div>
    <div class="kv"><span>Longest Audiobook</span><span>${esc(lg.title)} (${fmtDur(lg.minutes)})</span></div>`;
    const ag=periodGroups(audioB,b=>b.minutes);
    if(ag.length)h+=`<h2 style="font-size:16px;margin:16px 0 8px">By ${per}</h2>`+bars(ag,v=>(v/60).toFixed(1)+" hr");
  }else h+=`<p class="hint" style="margin:0">Add audiobook lengths to your finished audiobooks to see totals.</p>`;
  h+=note+`</div>`;
  return h;
}

/* render */
function render(){
  $("#ttl").textContent=TITLES[S.tab];
  $("#tabs").innerHTML=TABS.map(([k,l,svg])=>`<button data-tab="${k}"${S.tab===k?' aria-current="page"':""}><svg viewBox="0 0 24 24">${svg}</svg>${l}</button>`).join("");
  const v={reading:viewReading,toread:viewToRead,favs:viewFavs,years:viewYears,stats:viewStats,library:viewLibrary}[S.tab];
  $("#main").innerHTML=v();
  if(S.tab==="toread")fillToRead();
  if(S.tab==="library")fillLibrary();
}

/* detail sheet */
function openDetail(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  const au=isAudio(b),t=total(b);
  const kv=(k,v)=>v?`<div class="kv"><span>${k}</span><span>${v}</span></div>`:"";
  const rl=b.rating?(SCALE.find(s=>s[0]===b.rating)||[0,""])[1]:"";
  let prog="";
  if(b.status==="reading"){prog=t>0?`${Math.min(100,Math.round(b.progress/t*100))}% (${au?fmtDur(b.progress)+" of "+fmtDur(t):"page "+fmtN(b.progress)+" of "+fmtN(t)})`:(b.progress?(au?fmtDur(b.progress):"Page "+fmtN(b.progress)):"")}
  const five=b.status==="finished"&&b.rating===5;
  $("#layer").innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Book Details">
   <span class="pill ${b.status}">${STATUS[b.status]}</span>
   <h3 style="margin:10px 0 2px">${esc(b.title)}</h3>
   <p class="sub" style="margin-bottom:14px">${esc(authorName(b))}</p>
   <div class="panel${five?" gold":""}" style="padding-block:8px">
   ${kv("Rating",b.rating?`<b style="color:${five?"var(--gold-ink)":"var(--bark)"}">★ ${fmtR(b.rating)}</b> · ${rl}`:"")}
   ${kv("Date Finished",b.date?fmtDate(b.date):"")}
   ${kv("Progress",prog)}
   ${kv("Ownership",b.owned?OWN[b.owned]:"")}
   ${kv("Format",b.format)}
   ${kv("Pages",b.pages?fmtN(b.pages):"")}
   ${kv("Audiobook Length",b.minutes?fmtDur(b.minutes):"")}
   ${kv("Genres",b.genres.map(esc).join(", "))}
   ${kv("Notes",esc(b.notes))}
   ${!(b.rating||b.date||prog||b.owned||b.format||b.pages||b.minutes||b.genres.length||b.notes)?'<p class="hint" style="margin:8px 0">No other details yet. Tap Edit to add some.</p>':""}
   </div>
   <div class="actions" style="margin-top:16px"><button type="button" class="btn" id="dclose">Close</button><button type="button" class="btn primary" id="dedit">Edit</button></div>
  </div></div>`;
  $("#dclose").onclick=closeSheet;
  $("#dedit").onclick=()=>openForm(id);
  $("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeSheet()});
}

/* edit sheet */
function closeSheet(){$("#layer").innerHTML=""}
function openForm(id,preset){
  const b=id?books.find(x=>x.id===id):{id:0,title:"",first:"",last:"",status:"unread",owned:"",format:"",pages:0,minutes:0,progress:0,date:"",rating:0,genres:[],notes:""};
  if(!b)return;
  const st=preset&&preset.status?preset.status:b.status;
  const date=preset&&preset.date?preset.date:b.date;
  const opt=(type,name,val,label,checked,cls="")=>`<label class="opt ${cls}"><input type="${type}" name="${name}" value="${esc(val)}"${checked?" checked":""}><span>${label}</span></label>`;
  const au=isAudio(b);
  $("#layer").innerHTML=`<div class="overlay" id="ov"><form class="sheet" id="form" role="dialog" aria-modal="true" aria-label="${id?"Edit Book":"Add a Book"}" novalidate>
   <h3>${id?"Edit Book":"Add a Book"}</h3>
   <div class="field"><label for="f_title">Title</label><input type="text" id="f_title" value="${esc(b.title)}" autocomplete="off"></div>
   <div class="field"><label for="f_author">Author</label><input type="text" id="f_author" list="authors" value="${esc(authorName(b))}" autocomplete="off"><datalist id="authors">${[...new Set(books.map(authorName))].sort().map(a=>`<option value="${esc(a)}">`).join("")}</datalist><p class="hint" id="authhint"></p></div>
   <div class="field"><span class="lbl">Status</span><div class="opts">${Object.entries(STATUS).map(([k,l])=>opt("radio","status",k,l,st===k)).join("")}</div></div>
   <div class="field"><span class="lbl">Format</span><div class="opts">${opt("radio","format","","None",!b.format)}${FORMATS.map(f=>opt("radio","format",f,f,b.format===f)).join("")}</div></div>
   <div class="field forprint"><label for="f_pages">Pages</label><input type="number" id="f_pages" min="0" inputmode="numeric" value="${b.pages||""}"></div>
   <div class="field foraudio"><label for="f_mins">Audiobook Length (h:mm)</label><input type="text" id="f_mins" placeholder="12:30" value="${fmtHM(b.minutes)}"></div>
   <div id="readbox"><div class="field forprint"><label for="f_progp">Current Page</label><input type="number" id="f_progp" min="0" inputmode="numeric" value="${!au&&b.progress?b.progress:""}"></div>
   <div class="field foraudio"><label for="f_progm">Time Listened (h:mm)</label><input type="text" id="f_progm" placeholder="2:30" value="${au?fmtHM(b.progress):""}"></div></div>
   <div id="finbox"><div class="field"><span class="lbl">Rating</span><div class="opts">${opt("radio","rating","0","None",!b.rating)}${SCALE.map(([v,l])=>opt("radio","rating",v,`${v} · ${l}`,b.rating===v,"r")).join("")}</div></div>
   <div class="field"><label for="f_date">Date Finished</label><input type="date" id="f_date" value="${esc(date)}"></div></div>
   <div class="field"><span class="lbl">Ownership</span><div class="opts">${Object.entries(OWN).map(([k,l])=>opt("radio","owned",k,l,b.owned===k)).join("")}</div></div>
   <div class="field"><span class="lbl">Genres</span><div class="opts">${GENRES.map(g=>opt("checkbox","genre",g,esc(g),b.genres.includes(g))).join("")}</div></div>
   <div class="field"><label for="f_notes">Notes</label><textarea id="f_notes">${esc(b.notes)}</textarea></div>
   <p class="hint" id="err" style="color:var(--clay);font-weight:600" hidden></p>
   <div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div>
   ${id?`<div class="actions" style="margin-top:14px"><button type="button" class="btn danger" id="del">Delete Book</button></div>`:""}
  </form></div>`;
  const f=$("#form");
  const vis=()=>{
    const audio=f.format.value==="Audiobook",s=f.status.value;
    $$(".forprint",f).forEach(e=>e.hidden=audio);
    $$(".foraudio",f).forEach(e=>e.hidden=!audio);
    $("#readbox").hidden=s!=="reading";
    $("#finbox").hidden=s!=="finished";
  };
  const sync=()=>{const p=parseAuthor($("#f_author").value);$("#authhint").textContent=p.last?`Filed under ${p.last}${p.first?", "+p.first:""}`:""};
  vis();sync();
  f.addEventListener("change",e=>{
    if(e.target.name==="status"&&e.target.value==="finished"&&!$("#f_date").value)$("#f_date").value=todayISO();
    if(e.target.name==="status"||e.target.name==="format")vis();
  });
  $("#f_author").addEventListener("input",sync);
  $("#cancel").onclick=closeSheet;
  $("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeSheet()});
  if(id){let armed=false;$("#del").onclick=function(){if(!armed){armed=true;this.textContent="Tap Again to Delete for Good";return}
    books=books.filter(x=>x.id!==id);save();closeSheet();render();toast("Book Deleted")}}
  f.addEventListener("submit",e=>{
    e.preventDefault();
    const title=$("#f_title").value.trim(),p=parseAuthor($("#f_author").value),err=$("#err");
    const fail=m=>{err.textContent=m;err.hidden=false};
    if(!title)return fail("Add a title.");
    if(!p.last)return fail("Add an author.");
    const status=f.status.value,format=f.format.value;
    const mins=parseHM($("#f_mins").value);
    if(isNaN(mins))return fail("Use h:mm for audiobook length, like 12:30.");
    const pages=parseInt($("#f_pages").value,10)||0;
    let progress=b.progress;
    if(status==="reading"){
      if(format==="Audiobook"){progress=parseHM($("#f_progm").value);if(isNaN(progress))return fail("Use h:mm for time listened, like 2:30.")}
      else progress=parseInt($("#f_progp").value,10)||0;
    }
    const o={id:b.id,title,first:p.first,last:p.last,status,owned:f.owned.value||"",format,pages,minutes:mins,progress,
      rating:status==="finished"?parseFloat(f.rating.value)||0:0,
      date:status==="finished"?($("#f_date").value||todayISO()):"",
      genres:GENRES.filter(g=>$$("input[name=genre]:checked",f).some(i=>i.value===g)),notes:$("#f_notes").value.trim()};
    if(id)books[books.findIndex(x=>x.id===id)]=o;else{o.id=nextId++;books.push(o)}
    save();closeSheet();render();toast(id?"Saved":"Book Added");
  });
  setTimeout(()=>{if(!id)$("#f_title").focus()},50);
}

/* settings sheet */
function csv(){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const head=["Author Last Name","Author First Name","Book Title","Ownership","Read (Y/N)","Status","Format","Pages","Audiobook Length (h:mm)","Progress","Date Finished","Rating","Genres","Notes"];
  return [head.map(q).join(","),...[...books].sort(cmpAuthor).map(b=>[b.last,b.first,b.title,OWN[b.owned]||"",b.status==="finished"?"Y":"N",STATUS[b.status],b.format,b.pages||"",fmtHM(b.minutes),b.progress?(isAudio(b)?fmtHM(b.progress):b.progress):"",b.date,b.rating||"",b.genres.join(", "),b.notes].map(q).join(","))].join("\n");
}
function copyText(t,msg){
  const done=()=>toast(msg);
  const fb=()=>{const a=$("#bk");a.value=t;a.select();try{document.execCommand("copy");done()}catch(e){toast("Select the text and copy it")}};
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
}
function openSettings(){
  $("#layer").innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Backup and Restore">
   <h3>Backup and Restore</h3>
   <p class="hint" style="margin:0 0 12px">Your list is saved on this device. Copy a backup now and then, and paste it back to restore it or move to another device.</p>
   <div class="btnrow"><button class="btn primary" id="cj">Copy Backup</button><button class="btn" id="cc">Copy as Spreadsheet (CSV)</button></div>
   <h2 style="margin-top:22px">Restore from Backup</h2>
   <div class="field"><textarea class="code" id="bk" placeholder="Paste a backup here"></textarea></div>
   <div class="btnrow"><button class="btn" id="imp">Restore from Pasted Backup</button></div>
   <p class="hint" id="impmsg" style="color:var(--clay);font-weight:600" hidden></p>
   <h2>Reset</h2>
   <div class="btnrow"><button class="btn danger" id="rst">Reset to Original Spreadsheet List</button></div>
   <div class="actions" style="margin-top:22px"><button class="btn primary" id="close">Done</button></div></div></div>`;
  $("#close").onclick=closeSheet;
  $("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeSheet()});
  $("#cj").onclick=()=>copyText(JSON.stringify({app:"readingRoom",version:2,books}),"Backup Copied");
  $("#cc").onclick=()=>copyText(csv(),"Spreadsheet Copied");
  let armI=false;$("#imp").onclick=function(){
    const m=$("#impmsg");m.hidden=true;
    let a;try{const j=JSON.parse($("#bk").value);a=Array.isArray(j)?j:j.books}catch(e){}
    if(!Array.isArray(a)||!a.length||!a.every(x=>x&&typeof x.title==="string"&&typeof x.last==="string"&&STATUS[x.status])){m.textContent="That doesn't look like a Reading Room backup. Copy a fresh one and paste it here.";m.hidden=false;return}
    if(!armI){armI=true;this.textContent=`Tap Again to Replace Your List With ${a.length} Books`;return}
    nextId=1;books=a.map(x=>normalize(x,nextId++));save();closeSheet();render();toast("Restored "+books.length+" Books")};
  let armR=false;$("#rst").onclick=function(){if(!armR){armR=true;this.textContent="Tap Again to Erase Changes and Reset";return}
    books=seedBooks();save();closeSheet();render();toast("List Reset")};
}

/* events */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-view],[data-edit],[data-finish],[data-go],[data-own],[data-st],[data-year],[data-month],[data-sy],[data-prog]");
  if(!t)return;
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;render();window.scrollTo(0,0)}
  else if(d.go){S.tab=d.go;render();window.scrollTo(0,0)}
  else if(d.view)openDetail(+d.view);
  else if(d.edit)openForm(+d.edit);
  else if(d.finish)openForm(+d.finish,{status:"finished",date:todayISO()});
  else if(d.prog)saveProgress(+d.prog);
  else if(d.own){S.tr.own=d.own;render()}
  else if(d.st){S.lib.st=d.st;render()}
  else if(d.year){S.year=d.year;S.month="all";render()}
  else if(d.month){S.month=d.month;render()}
  else if(d.sy){S.sy=d.sy;render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="trq"){S.tr.q=e.target.value;fillToRead()}
  if(e.target.id==="lq"){S.lib.q=e.target.value;fillLibrary()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="trg"){S.tr.genre=e.target.value;fillToRead()}
  if(e.target.id==="ls"){S.lib.sort=e.target.value;fillLibrary()}
  if(e.target.id==="goal"){const v=parseInt(e.target.value,10);if(v>0){lsSet(GOALKEY,String(v));render()}}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeSheet();
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.pin){e.preventDefault();saveProgress(+e.target.dataset.pin)}
});
$("#add").onclick=()=>openForm(0);
$("#gear").onclick=openSettings;
load();render();
</script>
</body>
