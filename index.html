<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reading Room">
<!-- black-translucent: light status-bar text; the navy header paints behind it -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14233D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1322" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>The Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap">
<style>
/* ================= PALETTE =================
   Analogous blues. Navy is the dominant color (header, tab bar, text).
   One muted red (--danger) is reserved for destructive actions only. */
:root{
  --hdr:#14233D; --on-hdr:#FFFFFF; --hdr-muted:#B4C3D8; --hdr-sel:#DCEBFA; --on-hdr-sel:#14233D;
  --bg:#E9EFF6; --card:#F7FAFD; --line:#D3DDEA; --fg:#14233D; --muted:#56677E;
  --pri:#1F3A63; --on-pri:#FFFFFF;           /* Navy 700: primary buttons, selected chips, finished */
  --link:#2E6FB5; --link-t:#2964A6;             /* Blue 500: bar fills; slightly deeper for link text */
  --cur:#3F9BC9; --cur-ink:#1D6890; --cur-soft:#D6ECF6;   /* Cerulean: current/progress, 5-star */
  --tbr:#5B63B7; --tbr-ink:#4F57A8; --tbr-soft:#E3E5F6;          /* Indigo: TBR / unread */
  --fin-soft:#DDE5F0; --sky:#DCEBFA;
  --accent:#3F9BC9; --on-accent:#14233D;      /* "Add Book" in header */
  --danger:#A3423D; --danger-soft:#F4DEDC;
  --notset:#B9C3D3;
  --overlay:rgba(10,20,40,.5); --shadow:0 -8px 30px rgba(20,35,61,.22);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --hdr:#0A1322; --on-hdr:#E8EEF6; --hdr-muted:#93A6C0; --hdr-sel:#2A4670; --on-hdr-sel:#FFFFFF;
  --bg:#0E1828; --card:#16233A; --line:#2A3B57; --fg:#E3EAF4; --muted:#9DAEC4;
  --pri:#8DB8EA; --on-pri:#0E1828; --link:#8DB8EA; --link-t:#8DB8EA; --tbr-ink:#9EA5EC;
  --cur:#5DB4DD; --cur-ink:#7CC6EA; --cur-soft:#163A50;
  --tbr:#9EA5EC; --tbr-soft:#272C55; --fin-soft:#22385A; --sky:#173452;
  --accent:#5DB4DD; --on-accent:#0A1322;
  --danger:#EE9A93; --danger-soft:#4A2427; --notset:#41526D;
  --overlay:rgba(0,0,0,.6); --shadow:0 -8px 30px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --hdr:#0A1322; --on-hdr:#E8EEF6; --hdr-muted:#93A6C0; --hdr-sel:#2A4670; --on-hdr-sel:#FFFFFF;
  --bg:#0E1828; --card:#16233A; --line:#2A3B57; --fg:#E3EAF4; --muted:#9DAEC4;
  --pri:#8DB8EA; --on-pri:#0E1828; --link:#8DB8EA; --link-t:#8DB8EA; --tbr-ink:#9EA5EC;
  --cur:#5DB4DD; --cur-ink:#7CC6EA; --cur-soft:#163A50;
  --tbr:#9EA5EC; --tbr-soft:#272C55; --fin-soft:#22385A; --sky:#173452;
  --accent:#5DB4DD; --on-accent:#0A1322;
  --danger:#EE9A93; --danger-soft:#4A2427; --notset:#41526D;
  --overlay:rgba(0,0,0,.6); --shadow:0 -8px 30px rgba(0,0,0,.55); color-scheme:dark}
 
/* ================= LAYOUT ================= */
*{box-sizing:border-box}
html{background:var(--hdr)}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%;min-height:100vh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.padx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Header: navy, full-bleed, extends under the status bar */
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);color:var(--on-hdr);padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px}
header.top .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px}
header.top h1{font:600 25px/1.1 var(--serif);margin:0;flex:1;min-width:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--on-hdr);display:grid;place-items:center;flex:none}
.hbtn svg,.ico{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.addbtn{height:40px;padding:0 15px 0 11px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;display:flex;align-items:center;gap:5px;flex:none}
.addbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
main{max-width:680px;margin:0 auto;padding-top:14px;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
main.hasjump{padding-right:max(34px,env(safe-area-inset-right,0px))}
.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.subrow .sub{margin:0}
h2{font:600 20px/1.2 var(--serif);margin:26px 0 10px}
/* Tab bar: navy, light selected state */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--hdr);
  display:flex;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;min-width:0;min-height:50px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;color:var(--hdr-muted);font-size:11px;font-weight:600;border-radius:12px;margin:0 2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--on-hdr-sel);background:var(--hdr-sel)}
 
/* ================= CONTROLS ================= */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:6px 14px;min-height:44px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.chip small{opacity:.78}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input,.tools select{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px}
.fbtn{flex:none;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.fbtn .ico{width:18px;height:18px}
.fbtn .n{background:var(--pri);color:var(--on-pri);border-radius:9px;font-size:11px;padding:0 6px;line-height:17px}
.linkbtn{border:0;background:none;color:var(--link-t);font-weight:600;font-size:14px;padding:10px 4px;min-height:44px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 16px;min-height:44px;font-weight:600}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn.primary{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.wide{width:100%}
/* Confirmation pattern (used everywhere): first tap arms the button, second tap acts. */
.armed{background:var(--pri)!important;color:var(--on-pri)!important;border-color:var(--pri)!important}
.armed.danger,.armed.dz{background:var(--danger)!important;color:var(--bg)!important;border-color:var(--danger)!important}
 
/* ================= LISTS ================= */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);padding:10px 14px;min-height:60px;border-bottom:1px solid var(--line);cursor:pointer;scroll-margin-top:90px}
.list>:last-child,.list>:last-child .row{border-bottom:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.row .t{font:600 17px/1.25 var(--serif);overflow-wrap:anywhere;border:0;background:none;padding:0;text-align:left}
.row .a,.alink{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.alink{border:0;background:none;padding:2px 0;text-align:left;text-decoration:underline dotted;text-decoration-color:var(--line);text-underline-offset:3px}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;font-size:13px;color:var(--muted)}
.row .tiny{font-size:11px;color:var(--muted);letter-spacing:.02em}
.rate{font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums;font-size:15px}
.row.five{background:var(--sky);box-shadow:inset 4px 0 0 var(--cur)}
.row.five .rate{color:var(--cur-ink)}
.pill{border-radius:10px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.finished{background:var(--fin-soft);color:var(--pri)}
.pill.unread{background:var(--tbr-soft);color:var(--tbr-ink)}
.pill.reading{background:var(--cur-soft);color:var(--cur-ink)}
.pill.dnf{background:var(--danger-soft);color:var(--danger)}
.pill.fmt{background:var(--fin-soft);color:var(--pri)}
.pill.own{background:none;border:1px solid var(--line);color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;font:600 19px var(--serif);color:var(--fg);margin-bottom:4px}
/* Swipe rows (TBR) */
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.sw .row{border-bottom:0;touch-action:pan-y;transition:transform .18s ease}
.sw.drag .row{transition:none}
.sw .acts{position:absolute;inset:0 0 0 auto;display:flex}
.sw .acts button{width:92px;border:0;font-size:13px;font-weight:700;padding:0 6px;color:#fff}
.sw .acts .a1{background:#1F3A63}.sw .acts .a2{background:#5B63B7}
.sw .acts button.armed{background:#14233D!important;color:#fff!important}
/* Letter jump strip */
#jump{position:fixed;right:max(2px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 76px);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-direction:column;justify-content:center;width:28px;touch-action:none;user-select:none;-webkit-user-select:none}
#jump button{flex:0 1 22px;min-height:12px;border:0;background:none;color:var(--link-t);font-size:11px;font-weight:700;padding:0;line-height:1}
 
/* ================= CARDS / PANELS ================= */
.cards{display:flex;flex-direction:column;gap:12px}
.bookcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cur);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bookcard .t{font:600 22px/1.2 var(--serif);overflow-wrap:anywhere}
.bookcard .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.bookcard .top>div{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.bookcard .prog{margin:0}
.est{font-size:13px;color:var(--muted);margin:-2px 0 0}
.pline{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.pline b{color:var(--fg);font:600 22px/1 var(--serif);font-variant-numeric:tabular-nums}
.pin{display:flex;gap:8px;align-items:center}
.pin label{font-size:13px;font-weight:600;color:var(--muted);flex:none}
.pin input{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font:600 28px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;background:none;padding:0}
button.lab{color:var(--fg);text-decoration:underline dotted;text-decoration-color:var(--line);text-underline-offset:3px;min-height:28px}
.bar .track{height:12px;background:var(--fin-soft);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--link);border-radius:6px;display:block}
.bar.hi .fill{background:var(--cur)}
.bar .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;min-width:3.2em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.prog{height:12px;border-radius:6px;background:var(--fin-soft);overflow:hidden;margin:8px 0}
.prog div{height:100%;background:var(--cur)}
.goalrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.goalrow input{width:72px;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;text-align:center}
.stack{height:10px;border-radius:5px;background:var(--line);display:flex;overflow:hidden;margin:8px 0 6px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.big{font:600 30px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--muted);flex:none}
.kv>span:last-child,.kv>div:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.tags{font-size:12px;color:var(--muted)}
.notice{background:var(--sky);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.strip{display:flex;gap:2px;margin-top:6px;height:6px}
.strip i{flex:1;border-radius:2px;max-width:28px}
.c-fin{--c:var(--pri);background:var(--pri)}.c-cur{--c:var(--cur);background:var(--cur)}.c-own{--c:var(--tbr);background:var(--tbr)}.c-not{--c:var(--notset);background:var(--notset)}.c-dnf{--c:var(--danger);background:var(--danger)}
.c-print{--c:var(--pri);background:var(--pri)}.c-audio{--c:var(--cur);background:var(--cur)}.c-ebook{--c:var(--tbr);background:var(--tbr)}
 
/* ================= SHEETS ================= */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font:600 24px/1.2 var(--serif);margin:0 0 12px;outline:none}
.sheet h4{font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.field{margin-bottom:16px}
.field>label,.field>.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=search],.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.field textarea{min-height:80px;resize:vertical}
.two{display:flex;gap:8px}.field .two>input:first-child{flex:1;min-width:0;width:auto}.field .two>input:last-child{width:84px;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.small{gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:22px;font-size:14px;font-weight:500}
.opts.small .opt span{min-height:36px;padding:0 11px;font-size:13px}
.opt input:checked+span{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.opt input:focus-visible+span{outline:2px solid var(--link);outline-offset:2px}
.opt.r span{font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.err{color:var(--danger);font-weight:600}
.warn{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--tbr);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.actions{display:flex;gap:10px;margin-top:10px;position:sticky;bottom:-20px;background:var(--bg);padding:8px 0}
.actions .btn{flex:1}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
textarea.code{width:100%;height:96px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:var(--card);text-align:left;font-weight:500}
.setrow:last-child{border-bottom:0}
.setrow small{color:var(--muted);font-weight:400}
.chk{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px;border-bottom:1px solid var(--line);background:var(--card)}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none;margin:0}
.chk .main{flex:1;min-width:0}
.chk .t{font:600 16px/1.25 var(--serif)}
.chk .a{font-size:13px;color:var(--muted)}
.chk input.num{width:64px;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;text-align:center}
.mrow{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:56px;border-bottom:1px solid var(--line);background:var(--card)}
.mrow:last-child{border-bottom:0}
.mrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.mrow .nm small{color:var(--muted)}
.mrow.ed{flex-wrap:wrap}.mrow.ed .btnrow{width:100%;justify-content:flex-end}
.mrow input[type=text]{flex:1;min-width:0;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px}
/* Author card */
.ah{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.mono{width:52px;height:52px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;font:600 20px var(--serif);flex:none}
.ah h3{margin:0}.ah p{margin:0;color:var(--muted);font-size:14px}
.atiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px;margin:4px 0 8px}
.atiles div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.atiles b{display:block;font:600 21px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.atiles span{font-size:11px;color:var(--muted)}
.insight{background:var(--pri);color:var(--on-pri);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.pick{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tbr);border-radius:14px;padding:16px;margin-bottom:12px}
.pick .t{font:600 22px/1.2 var(--serif)}
details.flt{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;margin-top:12px}
details.flt summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}

<script>
"use strict";
/* =====================================================================
   CONSTANTS
   ===================================================================== */
// Built-in genre list. It now only SEEDS the user's editable list (settings.genres).
const GENRES=["Classic","Fantasy","Sci-Fi","Horror","Manga","Western","Literary Fiction","Historical Fiction","Mystery","Thriller","Young Adult","Romance","Non-Fiction","History","Memoir"];
// Aliases kept for old data.
const GENRE_MAP={"space opera":"Sci-Fi","dystopian":"Sci-Fi","post-apocalyptic":"Sci-Fi","time-travel":"Sci-Fi","frontier":"Western","crime/noir":"Mystery","memoir/biography":"Memoir"};
const SCALE=[[1,"Unreadable"],[2,"Bad"],[2.5,"Disappointing"],[3,"Neutral"],[3.25,"OK"],[3.5,"Good"],[3.75,"Very Good"],[4,"Great"],[4.25,"Really Great"],[4.5,"Amazing"],[4.75,"Almost Perfect"],[5,"Left Me Speechless"]];
const STATUS={unread:"Unread",reading:"Currently Reading",finished:"Finished",dnf:"DNF"};
const OWN={owned:"Owned",not:"Not Owned",library:"Library"};
const FORMATS=["Print","Audiobook","eBook"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// Storage keys. NEVER rename these: the phone's existing data lives under them.
const KEY="readingRoom.v2",OLDKEY="readingRoom.v1",GOALKEY="readingRoom.goal",SETKEY="readingRoom.settings";
const DAY=86400000;
 
/* =====================================================================
   STORAGE + SMALL HELPERS
   ===================================================================== */
const mem={};
function lsGet(k){try{const v=localStorage.getItem(k);return v===null?(k in mem?mem[k]:null):v}catch(e){return k in mem?mem[k]:null}}
function lsSet(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").trim().replace(/\s+/g," ").toLowerCase();
const isoRe=/^\d{4}-\d{2}-\d{2}$/;
 
/* =====================================================================
   SETTINGS (new key; goal stays under its old key)
   ===================================================================== */
let ST={genres:GENRES.slice(),tags:[],theme:"auto",lastBackup:"",reminderDismissed:"",mergeDeclined:[]};
function loadSettings(){
  try{const s=JSON.parse(lsGet(SETKEY)||"null");if(s&&typeof s==="object")applySettings(s,false)}catch(e){}
}
function applySettings(s,withGoal){
  if(Array.isArray(s.genres)){const g=[];s.genres.forEach(x=>{x=String(x).trim();if(x&&!g.some(y=>norm(y)===norm(x)))g.push(x)});if(g.length)ST.genres=g}
  if(Array.isArray(s.tags)){const t=[];s.tags.forEach(x=>{x=String(x).trim();if(x&&!t.some(y=>norm(y)===norm(x)))t.push(x)});ST.tags=t}
  if(["auto","light","dark"].includes(s.theme))ST.theme=s.theme;
  if(typeof s.lastBackup==="string")ST.lastBackup=s.lastBackup;
  if(typeof s.reminderDismissed==="string")ST.reminderDismissed=s.reminderDismissed;
  if(Array.isArray(s.mergeDeclined))ST.mergeDeclined=s.mergeDeclined.map(String);
  if(withGoal&&parseInt(s.goal,10)>0)lsSet(GOALKEY,String(parseInt(s.goal,10)));
}
function saveSettings(){lsSet(SETKEY,JSON.stringify(ST))}
function goal(){const g=parseInt(lsGet(GOALKEY),10);return g>0?g:24}
 
/* =====================================================================
   BOOKS: normalize / load / save
   ===================================================================== */
// Map a book's genres onto the stored list. Unknown genres are ADDED to the list, never dropped.
function mapGenres(arr){
  const out=[];
  (Array.isArray(arr)?arr:[]).forEach(g=>{
    const raw=String(g).trim();if(!raw)return;
    const k=raw.toLowerCase();
    let hit=ST.genres.find(x=>x.toLowerCase()===k);
    if(!hit&&GENRE_MAP[k])hit=ensureGenre(GENRE_MAP[k]);
    if(!hit)hit=ensureGenre(raw);
    if(!out.includes(hit))out.push(hit);
  });
  return ST.genres.filter(g=>out.includes(g));
}
let settingsDirty=false;
function ensureGenre(g){const f=ST.genres.find(x=>norm(x)===norm(g));if(f)return f;ST.genres.push(g);settingsDirty=true;return g}
function ensureTag(t){t=String(t).trim();if(!t)return"";const f=ST.tags.find(x=>norm(x)===norm(t));if(f)return f;ST.tags.push(t);settingsDirty=true;return t}
function mapTags(arr){const out=[];(Array.isArray(arr)?arr:[]).forEach(t=>{const h=ensureTag(t);if(h&&!out.includes(h))out.push(h)});return out}
 
// Every new field is OPTIONAL with a safe default, so v2 backups load unchanged.
function normalize(x,id){
  let owned="";
  if(x.owned===true||x.owned==="Y"||x.owned==="owned")owned="owned";
  else if(x.owned===false||x.owned==="N"||x.owned==="not")owned="not";
  else if(x.owned==="library")owned="library";
  const sn=x.seriesNum===""||x.seriesNum==null?null:parseFloat(x.seriesNum);
  return{id,title:String(x.title||""),last:String(x.last||""),first:String(x.first||""),
    status:STATUS[x.status]?x.status:"unread",owned,
    format:FORMATS.includes(x.format)?x.format:"",
    pages:Math.max(0,parseInt(x.pages,10)||0),minutes:Math.max(0,parseInt(x.minutes,10)||0),progress:Math.max(0,Math.round(+x.progress||0)),
    date:isoRe.test(x.date||"")?x.date:"",rating:+x.rating||0,
    genres:mapGenres(x.genres),notes:String(x.notes||""),
    // new optional fields
    series:String(x.series||"").trim(),
    seriesNum:isFinite(sn)?sn:null,
    tags:mapTags(x.tags),
    added:isoRe.test(x.added||"")?x.added:"",
    started:isoRe.test(x.started||"")?x.started:"",
    log:(Array.isArray(x.log)?x.log:[]).filter(e=>e&&isoRe.test(e.d)).map(e=>({d:e.d,v:Math.max(0,Math.round(+e.v||0))})),
    rereads:(Array.isArray(x.rereads)?x.rereads:[]).filter(r=>r&&isoRe.test(r.date)).map(r=>{const o={date:r.date,rating:+r.rating||0};if(r.note)o.note=String(r.note);return o})};
}
let nextId=1,books=[],loadProblem="";
function load(){
  loadSettings();
  const raw=lsGet(KEY);
  if(raw){
    try{
      const a=JSON.parse(raw);
      if(Array.isArray(a)){
        const seen=new Set();let mx=0;a.forEach(b=>{const i=parseInt(b&&b.id,10);if(i>mx)mx=i});nextId=mx+1;
        books=a.filter(b=>b&&typeof b==="object").map(b=>{let i=parseInt(b.id,10);if(!(i>0)||seen.has(i))i=nextId++;seen.add(i);return normalize(b,i)});
        if(settingsDirty){saveSettings();settingsDirty=false}
        return;
      }
    }catch(e){}
    // Saved data exists but can't be read: keep a copy and do NOT overwrite it.
    if(!lsGet(KEY+".recovery"))lsSet(KEY+".recovery",raw);
    loadProblem="Your saved list couldn't be read. A copy was kept. Restore a backup from Settings.";
  }
  try{const old=lsGet(OLDKEY);if(old){const a=JSON.parse(old);if(Array.isArray(a)&&a.length){nextId=1;books=a.map(x=>normalize(x,nextId++));save();return}}}catch(e){}
  books=[];nextId=1; // nothing saved: empty state. Nothing is written until the user acts.
}
function save(){lsSet(KEY,JSON.stringify(books));if(settingsDirty){saveSettings();settingsDirty=false}}
 
/* =====================================================================
   BACKUP: v3 export, v2/v3/array import
   ===================================================================== */
function exportObj(){
  return{app:"readingRoom",version:3,exported:new Date().toISOString(),books,
    settings:{goal:goal(),genres:ST.genres,tags:ST.tags,theme:ST.theme,lastBackup:ST.lastBackup,reminderDismissed:ST.reminderDismissed,mergeDeclined:ST.mergeDeclined}};
}
// Returns {books:[raw...], settings|null} or null if it isn't a backup.
function parseBackup(text){
  let j;try{j=JSON.parse(String(text).trim())}catch(e){return null}
  const a=Array.isArray(j)?j:(j&&Array.isArray(j.books)?j.books:null);
  if(!a||!a.length||!a.every(x=>x&&typeof x.title==="string"&&typeof x.last==="string"&&STATUS[x.status]))return null;
  return{books:a,settings:(!Array.isArray(j)&&j.version>=3&&j.settings&&typeof j.settings==="object")?j.settings:null,version:Array.isArray(j)?0:(j.version||0)};
}
function applyBackup(p){
  if(p.settings){applySettings(p.settings,true);applyTheme()}
  if(typeof drafts!=="undefined")drafts.clear();
  nextId=1;books=p.books.map(x=>normalize(x,nextId++));
  settingsDirty=true;save();
}
function markBackup(){ST.lastBackup=new Date().toISOString();saveSettings()}
function backupName(){return "reading-room-backup-"+todayISO()+".json"}
 
/* =====================================================================
   HELPERS
   ===================================================================== */
function parseAuthor(s){
  s=s.trim().replace(/\s+/g," ");if(!s)return{first:"",last:""};
  if(s.includes("&")){const p=s.split("&").map(parseAuthor);return{first:p.map(x=>x.first).join(" & "),last:p.map(x=>x.last).join(" & ")}}
  let jr="";const m=s.match(/^(.*?)\s+(Jr\.?|Sr\.?)$/i);if(m){s=m[1];jr=" "+m[2]}
  const small=["le","de","la","van","von","da","di","du","del","der"];
  const t=s.split(" ");if(t.length===1)return{first:"",last:t[0]+jr};
  let i=t.length-1;while(i>1&&small.includes(t[i-1].toLowerCase()))i--;
  return{first:t.slice(0,i).join(" "),last:t.slice(i).join(" ")+jr};
}
const authorName=b=>(b.first?b.first+" ":"")+b.last;
const cmpStr=(a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"});
const cmpAuthor=(a,b)=>cmpStr(a.last,b.last)||cmpStr(a.first,b.first)||cmpStr(a.title,b.title);
const cmpTitle=(a,b)=>cmpStr(sortTitle(a.title),sortTitle(b.title));
const sortTitle=t=>t.replace(/^(the|a|an)\s+/i,"");
const now=()=>new Date();
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayISO(){return iso(now())}
function isoToDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
const daysBetween=(a,b)=>Math.round((isoToDate(b)-isoToDate(a))/DAY);
function fmtDate(s){if(!s)return"";return isoToDate(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const fmtR=r=>String(+(+r).toFixed(2));
const fmtN=n=>Math.round(n).toLocaleString();
function fmtHM(m){return m>0?Math.floor(m/60)+":"+String(m%60).padStart(2,"0"):""}
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h&&r?`${h} hr ${r} min`:h?`${h} hr`:`${r} min`}
function parseHM(s){s=String(s).trim();if(!s)return 0;let m;
  if((m=s.match(/^(\d+):(\d{1,2})$/))&&+m[2]<60)return +m[1]*60+ +m[2];
  if(/^\d+(\.\d+)?$/.test(s))return Math.round(parseFloat(s)*60);
  return NaN}
const isAudio=b=>b.format==="Audiobook";
const total=b=>isAudio(b)?b.minutes:b.pages;
const lenLabel=b=>isAudio(b)?(b.minutes?fmtDur(b.minutes):""):(b.pages?fmtN(b.pages)+" pp":"");
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const plural=(n,s,p)=>n+" "+(n===1?s:(p||s+"s"));
const ratingLabel=r=>(SCALE.find(s=>s[0]===r)||[0,""])[1];
const initials=n=>n.split(/[\s&]+/).filter(w=>/^[A-Za-zÀ-ɏ]/.test(w)).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?";
const byId=id=>books.find(x=>x.id===id);
const isManga=b=>b.genres.some(g=>norm(g)==="manga");
const say=t=>{const l=$("#live");if(l){l.textContent="";setTimeout(()=>l.textContent=t,30)}};
 
// Search: title, author, genres, notes, series, tags.
const matchQ=(b,q)=>!q||(b.title+" "+authorName(b)+" "+b.genres.join(" ")+" "+b.notes+" "+b.series+" "+b.tags.join(" ")).toLowerCase().includes(q.trim().toLowerCase());
 
/* ---------- reads (first read + re-reads) ---------- */
// A "read" is one completed reading: the first finish plus each re-read.
function readsOf(b){
  if(b.status!=="finished")return[];
  const r=[{b,date:b.date,rating:b.rating,re:false}];
  b.rereads.forEach(x=>r.push({b,date:x.date,rating:x.rating,re:true,note:x.note||""}));
  return r;
}
const allReads=()=>books.flatMap(readsOf);
// Latest rating used for all-time averages.
function latestRating(b){
  const r=readsOf(b).filter(x=>x.rating>0).sort((x,y)=>(x.date||"").localeCompare(y.date||""));
  return r.length?r[r.length-1].rating:0;
}
const readCount=b=>b.status==="finished"?1+b.rereads.length:0;
 
/* ---------- progress log + pace ---------- */
function logProgress(b,v,d){
  d=d||todayISO();
  const last=b.log[b.log.length-1];
  if(last&&last.d===d)last.v=v;else b.log.push({d,v});
}
function startReading(b){
  b.status="reading";
  if(!b.started)b.started=todayISO();
  if(!b.log.length)b.log.push({d:todayISO(),v:b.progress||0});
}
function finishLog(b){const t=total(b);if(t>0&&b.log.length)logProgress(b,t)}
/* PACE: progress in the last 60 days (log differences inside the window, pro-rated
   when an interval straddles the window start) ÷ days in the window. If the first
   log entry is newer than 60 days, divide by days since that entry instead.
   Two separate paces: print/eBook pages per day, audiobook minutes per day.
   Manga never counts. Returns null when there isn't enough recent data. */
function pace(audio,today){
  today=today||todayISO();
  const start=iso(new Date(isoToDate(today).getTime()-60*DAY));
  let sum=0,updates=0,first=null;
  books.forEach(b=>{
    if(isManga(b)||isAudio(b)!==audio||b.log.length<1)return;
    const L=b.log.filter(e=>e.d<=today);
    if(L.length&&(!first||L[0].d<first))first=L[0].d;
    for(let i=1;i<L.length;i++){
      const a=L[i-1],c=L[i];if(c.d<=start)continue;
      const diff=Math.max(0,c.v-a.v);if(!diff&&c.v===a.v)continue;
      const span=Math.max(1,daysBetween(a.d,c.d)),inside=Math.min(span,daysBetween(start,c.d));
      sum+=diff*(inside/span);updates++;
    }
  });
  if(!first)return null;
  const winStart=first>start?first:start;
  const days=Math.max(1,daysBetween(winStart,today));
  if(daysBetween(first,today)<7||updates<2||sum<=0)return null;
  return{perDay:sum/days,days,updates};
}
function estimateLine(b,today){
  if(isManga(b))return"";
  const t=total(b);if(!(t>0))return"";
  const p=pace(isAudio(b),today);if(!p)return"";
  const left=Math.max(0,t-b.progress);if(!left)return"";
  const d=Math.ceil(left/p.perDay);
  const rate=isAudio(b)?"~"+fmtDur(Math.max(1,p.perDay))+"/day":"~"+fmtN(Math.max(1,p.perDay))+" pages/day";
  return (d<=1?"About a day left":"About "+d+" days left")+" at your recent pace ("+rate+")";
}
 
/* ---------- authors ---------- */
function authorStats(name){
  const a=books.filter(b=>authorName(b)===name);
  const fin=a.filter(b=>b.status==="finished"),un=a.filter(b=>b.status==="unread");
  const r=fin.map(latestRating).filter(x=>x>0);
  return{name,all:a,fin,un,own:un.filter(b=>b.owned==="owned"),reading:a.filter(b=>b.status==="reading"),dnf:a.filter(b=>b.status==="dnf"),avg:r.length?avg(r):0,nr:r.length,last:a[0]?a[0].last:"",first:a[0]?a[0].first:""};
}
function allAuthors(){const s=new Set(books.map(authorName));return[...s].filter(Boolean).map(authorStats)}
 
/* ---------- series ---------- */
function seriesMap(){
  const m={};
  books.forEach(b=>{if(!b.series)return;const k=norm(b.series);(m[k]=m[k]||{name:b.series,books:[]}).books.push(b)});
  Object.values(m).forEach(s=>s.books.sort((a,b)=>(a.seriesNum==null?1e9:a.seriesNum)-(b.seriesNum==null?1e9:b.seriesNum)||(a.date||"9").localeCompare(b.date||"9")||cmpTitle(a,b)));
  return m;
}
const seriesOf=name=>seriesMap()[norm(name)];
// The next unread book in a series: first book in order that is unread, when nothing before it is in progress.
function nextInSeries(s){for(const b of s.books){if(b.status==="unread")return b;if(b.status==="reading")return null}return null}
const segClass=b=>b.status==="finished"?"c-fin":b.status==="reading"?"c-cur":b.status==="dnf"?"c-dnf":b.owned==="owned"?"c-own":"c-not";
 
/* ---------- re-read merge (old-style separate entries) ---------- */
const isOldReread=b=>/^re-?read\b/i.test(b.notes.trim());
const sig=b=>norm(b.title)+"|"+norm(authorName(b))+"|"+b.date;
function rereadCandidates(includeDeclined){
  const out=[];
  books.forEach(c=>{
    if(!isOldReread(c)||c.status!=="finished"||!c.date)return;
    if(!includeDeclined&&ST.mergeDeclined.includes(sig(c)))return;
    const orig=books.filter(o=>o!==c&&!isOldReread(o)&&o.status==="finished"&&norm(o.title)===norm(c.title)&&norm(authorName(o))===norm(authorName(c)))
      .sort((x,y)=>(x.date||"9").localeCompare(y.date||"9"))[0];
    if(orig)out.push({copy:c,orig});
  });
  return out;
}
function doMerge(list){
  list.forEach(({copy,orig})=>{
    const extra=copy.notes.trim().replace(/^re-?read\b[\s;:,.\-–—]*/i,"").trim();
    const e={date:copy.date,rating:copy.rating};if(extra)e.note=extra;

/* ---------- swipe on TBR rows (all actions also live in the detail sheet) ---------- */
(function(){
  let s=null,open=null;

  const closeOpen=()=>{if(open){open.querySelector(".row").style.transform="";open.classList.remove("isopen");open=null}};
  document.addEventListener("pointerdown",e=>{
    const sw=e.target.closest(".sw");

    s={sw,x:e.clientX,y:e.clientY,dx:0,dir:null,base:sw===open?-W:0};

    if(!s)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;

    if(s.dir!=="h")return;
    s.dx=dx;const x=Math.max(-W,Math.min(0,s.base+dx));s.sw.querySelector(".row").style.transform=`translateX(${x}px)`;
  });
  const end=()=>{
    if(!s)return;const {sw,dir,dx,base}=s;s=null;sw.classList.remove("drag");
    if(dir!=="h")return;
    sw._swiped=Date.now();
    const x=base+dx;
    if(x<-W/3){sw.querySelector(".row").style.transform=`translateX(${-W}px)`;sw.classList.add("isopen");open=sw;sw.querySelectorAll(".acts button").forEach(b=>b.tabIndex=0)}
    else{sw.querySelector(".row").style.transform="";if(open===sw)open=null}
  };
  document.addEventListener("pointerup",end);document.addEventListener("pointercancel",()=>{if(s){s.sw.classList.remove("drag");if(s.dir==="h")s.sw.querySelector(".row").style.transform=s.base?`translateX(${-W}px)`:"";s=null}});
  // swallow the click that ends a swipe so it doesn't open the book
  document.addEventListener("click",e=>{const sw=e.target.closest(".sw");if(sw&&sw._swiped&&Date.now()-sw._swiped<350&&!e.target.closest(".acts")){e.stopPropagation();e.preventDefault()}},true);

    const a=e.target.closest("[data-swa]");if(!a)return;

  const yr=String(now().getFullYear()),thisYr=all.filter(r=>r.date&&r.date.slice(0,4)===yr).length,g=goal();
  if(sy==="all"||sy===yr)h+=`<h2>${yr} Goal</h2><div class="panel"><b style="font:600 20px var(--serif)">${thisYr} of ${g} books</b><div class="prog" role="progressbar" aria-label="Goal progress" aria-valuemin="0" aria-valuemax="${g}" aria-valuenow="${thisYr}"><div style="width:${Math.min(100,thisYr/g*100)}%"></div></div><p class="hint" style="margin:-2px 0 8px">${goalPace(thisYr,g)}</p><div class="goalrow"><label for="goal">Yearly Goal</label> <input type="number" id="goal" min="1" max="999" value="${g}"> books</div></div>`;
  if(!R.length)return h+`<div class="empty" style="margin-top:20px"><b>No Finished Books Here</b>Pick a different period, or finish a book.</div>`;
  // Ratings
  if(rt.length)h+=`<h2>Ratings · ${scopeName}</h2><div class="panel">${bars(ratingRows(rt),null,"Ratings")}<p class="hint">${rt.filter(x=>x>=4).length} of ${rt.length} rated books are 4 or higher. Median ${fmtR(median(rt))}.</p></div>`;
  // Rating trends (all-time view, 2+ years)
  if(sy==="all"){
    const ys=years.map(y=>{const r=all.filter(x=>x.date&&x.date.slice(0,4)===y&&x.rating>0).map(x=>x.rating);return[y,r.length?avg(r):0,r.length]}).filter(x=>x[2]);
    if(ys.length>=2){
      const gm={};books.filter(b=>b.status==="finished").forEach(b=>{const r=latestRating(b);if(r>0)b.genres.forEach(x=>(gm[x]=gm[x]||[]).push(r))});
      const gl=Object.entries(gm).filter(x=>x[1].length>=3).map(([k,v])=>[k,avg(v),v.length]).sort((a,b)=>b[1]-a[1]);
      h+=`<h2>Rating Trends</h2><div class="panel">${bars(ys.map(([y,a,n])=>[y,a,n]),(v,n)=>"★"+v.toFixed(2),"Average rating by year")}`;
      if(gl.length>=2)h+=`<p class="hint">Highest-rated genre: <b>${esc(gl[0][0])}</b> ★${gl[0][1].toFixed(2)} (${gl[0][2]} books).<br>Lowest-rated genre: <b>${esc(gl[gl.length-1][0])}</b> ★${gl[gl.length-1][1].toFixed(2)} (${gl[gl.length-1][2]} books).</p>`;
      h+=`</div>`;
    }
  }
  // Genres
  const UB=uniqBooks(R);
  const rateOf=b=>sy==="all"?latestRating(b):(R.filter(r=>r.b===b&&r.rating>0).map(r=>r.rating).pop()||0);
  const gm={};UB.forEach(b=>{const r=rateOf(b);b.genres.forEach(x=>{(gm[x]=gm[x]||{n:0,r:[]}).n++;if(r>0)gm[x].r.push(r)})});
  const gl=Object.entries(gm).sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0]));
  if(gl.length)h+=`<h2>Genres · ${scopeName}</h2><div class="panel">${bars(gl.map(([k,v])=>[k,v.n,v.r]),(v,r)=>r&&r.length?`${v} · ★${avg(r).toFixed(1)}`:v,"Genres")}</div>`;
  // Top authors (tap to open the author card)
  const am={};UB.forEach(b=>{const k=authorName(b),r=rateOf(b);const o=(am[k]=am[k]||{n:0,r:[]});o.n++;if(r>0)o.r.push(r)});
  const al=Object.entries(am).sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0])).slice(0,10);
  h+=`<h2>Top Authors · ${scopeName}</h2><div class="panel">${bars(al.map(([k,v])=>[k,v.n,v.r,"",true]),(v,r)=>r&&r.length?`${v} · ★${avg(r).toFixed(1)}`:v,"Top authors")}</div>`;
  // Format breakdown
  const fc=[["Print","c-print"],["Audiobook","c-audio"],["eBook","c-ebook"]].map(([f,c])=>[f,c,R.filter(r=>r.b.format===f).length]);
  const ns=R.filter(r=>!r.b.format).length,tot=R.length;
  if(fc.some(x=>x[2])){
    const eb=R.filter(r=>r.b.format==="eBook"&&r.b.pages>0).reduce((s,r)=>s+r.b.pages,0),pr=pagesTotal-eb;
    const parts=[];if(pr)parts.push(fmtN(pr)+" print pages");if(eb)parts.push(fmtN(eb)+" eBook pages");if(minsTotal)parts.push(fmtDur(minsTotal)+" listened");
    h+=`<h2>Formats · ${scopeName}</h2><div class="panel"><div class="stack" role="img" aria-label="${fc.map(x=>x[0]+" "+x[2]).join(", ")}${ns?", not set "+ns:""}">${fc.map(([f,c,n])=>n?`<i class="${c}" style="width:${n/tot*100}%"></i>`:"").join("")}${ns?`<i class="c-not" style="width:${ns/tot*100}%"></i>`:""}</div><div class="legend" aria-hidden="true">${fc.filter(x=>x[2]).map(([f,c,n])=>`<span class="${c}" style="background:none">${f} ${n}</span>`).join("")}${ns?`<span class="c-not" style="background:none">Not set ${ns}</span>`:""}</div>${parts.length?`<p class="hint">${parts.join(" · ")}</p>`:""}</div>`;
  }
  const bp=periodGroups(R,()=>1,sy);
  if(bp.length)h+=`<h2>Books Finished by ${per}</h2><div class="panel">${bars(bp,null,"Books by "+per)}</div>`;
  const undated=R.filter(r=>!r.date).length;
  const note=undated&&sy==="all"?`<p class="hint">${plural(undated,"finished book")} ${undated===1?"has":"have"} no finish date and ${undated===1?"is":"are"} left out of the by-year chart.</p>`:"";
  if(pR.length){
    const lg=[...pR].sort((a,b)=>b.b.pages-a.b.pages)[0].b;
    h+=`<h2>Pages Read · ${scopeName}</h2><div class="panel"><div class="big">${fmtN(pagesTotal)} pages</div><div style="height:8px"></div>
    <div class="kv"><span>Books With Page Counts</span><span>${pR.length} of ${R.filter(r=>!isAudio(r.b)).length}</span></div>
    <div class="kv"><span>Average Length</span><span>${fmtN(pagesTotal/pR.length)} pages</span></div>
    <div class="kv"><span>Longest Book</span><span>${esc(lg.title)} (${fmtN(lg.pages)})</span></div>`;
    const pg=periodGroups(pR,r=>r.b.pages,sy);
    if(pg.length>1)h+=`<h2 style="font-size:16px;margin:16px 0 8px">By ${per}</h2>`+bars(pg,v=>fmtN(v),"Pages by "+per);
    h+=note+`</div>`;
  }
  if(aR.length){
    const lg=[...aR].sort((a,b)=>b.b.minutes-a.b.minutes)[0].b;
    h+=`<h2>Hours Listened · ${scopeName}</h2><div class="panel"><div class="big">${fmtDur(minsTotal)}</div><div style="height:8px"></div>
    <div class="kv"><span>Audiobooks With Lengths</span><span>${aR.length} of ${R.filter(r=>isAudio(r.b)).length}</span></div>
    <div class="kv"><span>Average Length</span><span>${fmtDur(minsTotal/aR.length)}</span></div>
    <div class="kv"><span>Longest Audiobook</span><span>${esc(lg.title)} (${fmtDur(lg.minutes)})</span></div>`;
    const ag=periodGroups(aR,r=>r.b.minutes,sy);
    if(ag.length>1)h+=`<h2 style="font-size:16px;margin:16px 0 8px">By ${per}</h2>`+bars(ag,v=>(v/60).toFixed(1)+" hr","Hours by "+per);
    h+=note+`</div>`;
  }
  return h;
}

function pickPool(){
  const P=S.pick,sm=seriesMap(),nexts=new Set(Object.values(sm).map(nextInSeries).filter(Boolean).map(b=>b.id));
  return books.filter(b=>{
    if(b.status!=="unread")return false;
    if(P.own!=="any"&&b.owned!==P.own)return false;
    if(P.genres.length&&!P.genres.some(g=>b.genres.includes(g)))return false;
    if(P.tags.length&&!P.tags.some(g=>b.tags.includes(g)))return false;
    if(P.format&&b.format!==P.format)return false;
    if(!lenOK(b,P.len))return false;
    if(P.known&&!(total(b)>0))return false;
    if(P.author&&authorName(b)!==P.author)return false;
    if(P.series==="next"&&!nexts.has(b.id))return false;
    if(P.series==="skip"&&b.series&&!nexts.has(b.id))return false;
    return true;
  });
}
function pickCount(){const P=S.pick;return(P.own!=="any")+P.genres.length+P.tags.length+!!P.format+(P.len.u!=="any")+!!P.author+(P.series!=="any")+P.known}

  openSheet(()=>{
    const cur=rereadCandidates(!!fromRestore);if(!cur.length)return false;
    drawSheet(`<h3>Combine re-reads?</h3>
     <p class="hint" style="margin:-4px 0 12px">The app now keeps re-reads on the original book. ${cur.length===1?"This entry looks":"These entries look"} like older re-reads saved as separate books. Merging moves each date and rating onto the original and removes the extra entry. Nothing changes unless you confirm.</p>
     <div class="list">${cur.map(({copy,orig})=>`<div class="mrow" style="flex-direction:column;align-items:flex-start;gap:2px"><b style="font-family:var(--serif)">${esc(copy.title)}</b><span class="hint" style="margin:0">${esc(authorName(copy))}</span><span style="font-size:14px">Re-read ${fmtDate(copy.date)}${copy.rating?" · ★"+fmtR(copy.rating):""} → added to your read from ${orig.date?fmtDate(orig.date):"(no date)"}</span></div>`).join("")}</div>
     <div class="actions"><button type="button" class="btn" id="mno">Not now</button><button type="button" class="btn primary" id="myes">Merge ${cur.length}</button></div>`,"Combine re-reads");
    $("#mno").onclick=()=>{cur.forEach(x=>{const s=sig(x.copy);if(!ST.mergeDeclined.includes(s))ST.mergeDeclined.push(s)});saveSettings();closeSheet();toast("Left as separate entries")};
    $("#myes").onclick=function(){arm(this,`Tap again to merge ${cur.length}`,()=>{doMerge(cur);render();closeSheet();toast("Re-reads combined")})};
  });
}
 
/* =====================================================================
   QUICK FILL (finished books + owned TBR). Edits are held as drafts and
   saved together with one confirmation.
   ===================================================================== */
const drafts=new Map();
function needsDetails(b){const len=isAudio(b)?b.minutes:b.pages;return b.status==="unread"?!(len>0):(!(len>0)||!b.date||!b.owned)}
function draftOf(b){return drafts.get(b.id)||b}
function qrow(b0){
  const b=draftOf(b0),au=isAudio(b),lv=au?fmtHM(b.minutes):(b.pages||""),tbr=b0.status==="unread";
  return `<div class="qrow${drafts.has(b.id)?" edited":needsDetails(b)?"":" done"}" data-qid="${b.id}"><div><div class="t">${esc(b.title)}</div><div class="a">${esc(authorName(b))}</div></div><div class="qc"><label class="qa"><input type="checkbox" data-q="aud"${au?" checked":""}><span>Audiobook</span></label><input data-q="len" aria-label="${au?"Runtime":"Pages"} for ${esc(b.title)}" ${au?'type="text" inputmode="text" placeholder="h:mm"':'type="number" inputmode="numeric" min="0" placeholder="Pages"'} value="${lv}">${tbr?"":`<input data-q="date" type="month" aria-label="Month finished for ${esc(b.title)}" value="${b.date?b.date.slice(0,7):""}"><select data-q="own" aria-label="Ownership for ${esc(b.title)}"><option value="">Ownership</option>${Object.entries(OWN).map(([k,l])=>`<option value="${k}"${b.owned===k?" selected":""}>${l}</option>`).join("")}</select>`}</div></div>`;
}
function viewFill(){
  return `<div class="btnrow" style="margin-bottom:10px"><button class="btn sm" data-act="fillback">← Back</button></div>
  <div class="seg" role="group" aria-label="Which books"><button class="chip" data-qm="finished" aria-pressed="${S.fill.mode==="finished"}">Finished</button><button class="chip" data-qm="owned" aria-pressed="${S.fill.mode==="owned"}">Owned TBR</button></div>
  <p class="sub" id="qsub"></p>
  <div class="tools"><input type="search" id="fq" placeholder="Search title or author" aria-label="Search" value="${esc(S.fill.q)}"><label class="qa" style="flex:none"><input type="checkbox" id="qneed"${S.fill.need?" checked":""}><span>Missing only</span></label></div>
  <div id="qlist"></div><div class="savebar" id="qbar" hidden><button class="btn" id="qdiscard">Discard</button><button class="btn primary" id="qsave"></button></div>`;
}
function fillPool(){return books.filter(b=>S.fill.mode==="finished"?b.status==="finished":b.status==="unread"&&b.owned==="owned")}
function updateQSub(){
  const pool=fillPool(),done=pool.filter(b=>!needsDetails(draftOf(b))).length;
  const el=$("#qsub");if(el)el.textContent=`${done} of ${pool.length} complete · tick Audiobook for audio titles, then enter the runtime as h:mm`;
  const bar=$("#qbar");if(bar){bar.hidden=!drafts.size;$("#qsave").textContent=`Save ${plural(drafts.size,"change")}`;$("#qsave").classList.remove("armed");$("#qsave").dataset.armed=""}
}
function fillQ(){
  let a=fillPool().filter(b=>matchQ(b,S.fill.q));
  if(S.fill.need)a=a.filter(b=>drafts.has(b.id)||needsDetails(b));
  a.sort(cmpAuthor);
  $("#qlist").innerHTML=a.length?`<div class="list">${a.map(qrow).join("")}</div>`:emptyBox(S.fill.need?"All Caught Up":"Nothing Matches",S.fill.need?"Every book here has its details.":"Try a different search.");
  updateQSub();
  $("#qsave").onclick=function(){arm(this,`Tap again to save ${plural(drafts.size,"change")}`,()=>{drafts.forEach((d,id)=>{const i=books.findIndex(x=>x.id===id);if(i>=0)books[i]=d});drafts.clear();save();fillQ();toast("Quick Fill saved")})};
  $("#qdiscard").onclick=function(){arm(this,"Tap again to discard",()=>{drafts.clear();fillQ()})};
}
function handleQ(el){
  const rowEl=el.closest("[data-qid]");if(!rowEl)return;
  const id=+rowEl.dataset.qid,b0=byId(id);if(!b0)return;
  const b=drafts.get(id)||JSON.parse(JSON.stringify(b0));
  const k=el.dataset.q;
  if(k==="aud"){b.format=el.checked?"Audiobook":"Print"}
  else if(k==="len"){
    if(isAudio(b)){const m=parseHM(el.value);if(isNaN(m)){toast("Use h:mm, like 12:30");el.value=fmtHM(b.minutes);return}b.minutes=m}
    else{const n=parseInt(el.value,10)||0;b.pages=n>0?n:0;if(n>0&&!b.format)b.format="Print"}
  }else if(k==="own")b.owned=el.value;
  else if(k==="date"){if(el.value!==(b.date||"").slice(0,7))b.date=el.value?el.value+"-01":""}
  if(JSON.stringify(b)===JSON.stringify(b0))drafts.delete(id);else drafts.set(id,b);
  if(k==="aud"){rowEl.outerHTML=qrow(b0);const n=$(`[data-qid="${id}"] [data-q="aud"]`);if(n)n.focus({preventScroll:true})}
  else{const d=draftOf(b0);rowEl.classList.toggle("edited",drafts.has(id));rowEl.classList.toggle("done",!drafts.has(id)&&!needsDetails(d));if(k==="len"&&isAudio(d))el.value=fmtHM(d.minutes)}
  updateQSub();
}
 
/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  $("#ttl").textContent=TITLES[S.tab];
  $("#tabs").innerHTML=TABS.map(([k,l,svg])=>`<button data-tab="${k}"${S.tab===k||(S.tab==="fill"&&k===S.prevTab)?' aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${svg}</svg>${l}</button>`).join("");
  const v={current:viewCurrent,tbr:viewTBR,authors:viewAuthors,series:viewSeries,finished:viewFinished,stats:viewStats,fill:viewFill}[S.tab];
  $("#main").innerHTML=v();
  let jumpOn=false;
  if(S.tab==="tbr")fillTBR();
  else if(S.tab==="authors")fillAuthors();
  else if(S.tab==="fill")fillQ();
  else if(S.tab==="finished"){jumpOn=S.fin.sort==="title"||S.fin.sort==="author";setJump(jumpOn)}
  if(!["tbr","authors","finished"].includes(S.tab))setJump(false);
}
function go(tab){
  if(S.tab==="fill"&&tab!=="fill"&&drafts.size){toast("Save or discard your Quick Fill changes first");const b=$("#qbar");if(b)b.scrollIntoView({block:"end"});return}
  if(tab==="fill"&&S.tab!=="fill")S.prevTab=S.tab;
  S.tab=tab;render();window.scrollTo(0,0);
}
 
/* =====================================================================
   EVENTS (delegated)
   ===================================================================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-author],[data-series],[data-view],[data-edit],[data-finish],[data-go],[data-own],[data-year],[data-month],[data-sy],[data-prog],[data-qm],[data-act],[data-yir]");
  if(!t)return;
  const d=t.dataset;
  if(d.tab)go(d.tab);
  else if(d.go){if(sheetCur&&d.go==="fill"){if(S.tab==="fill"){closeAll();return}closeAll()}go(d.go)}
  else if(d.author!==undefined)openAuthor(d.author);
  else if(d.series!==undefined)openSeries(d.series);
  else if(d.view)openDetail(+d.view);
  else if(d.edit)openForm(+d.edit);
  else if(d.finish)openRate(+d.finish,false);
  else if(d.prog)saveProgress(+d.prog);
  else if(d.yir)openYIR(d.yir);
  else if(d.qm){S.fill.mode=d.qm;render()}
  else if(d.own){S.tr.own=d.own;render()}
  else if(d.year){S.year=d.year;S.month="all";render()}
  else if(d.month){S.month=d.month;render()}
  else if(d.sy){S.sy=d.sy;render()}
  else if(d.act){
    const a=d.act;
    if(a==="close")tryClose();
    else if(a==="add")openForm(0);
    else if(a==="settings")openSettings();
    else if(a==="trsheet")openTBRSheet();
    else if(a==="finsheet")openFinSheet();
    else if(a==="pick")openPick();
    else if(a==="newseries")openSeriesEditor(null);
    else if(a==="fillback")go(S.prevTab||"finished");
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="trq"){S.tr.q=e.target.value;fillTBR()}
  if(e.target.id==="auq"){S.au.q=e.target.value;fillAuthors()}
  if(e.target.id==="fq"){S.fill.q=e.target.value;fillQ()}
});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.q){handleQ(e.target);return}
  if(e.target.id==="aus"){S.au.sort=e.target.value;fillAuthors()}
  if(e.target.id==="qneed"){S.fill.need=e.target.checked;fillQ()}
  if(e.target.id==="goal"){const v=parseInt(e.target.value,10);if(v>0){lsSet(GOALKEY,String(v));render()}}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheetCur){e.preventDefault();tryClose()}
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.pin){e.preventDefault();saveProgress(+e.target.dataset.pin)}
  // keyboard access for clickable rows
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("row")){e.preventDefault();e.target.click()}
});
$("#add").onclick=()=>openForm(0);
$("#gear").onclick=openSettings;
$("#srch").onclick=openSearch;
 
/* =====================================================================
   START
   ===================================================================== */
load();applyTheme();render();
setTimeout(()=>offerMerge(false),400);
// Ask the browser to keep this site's storage (fails silently where unsupported).
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
// Offline support. Relative path so it works under a GitHub Pages project folder.
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
